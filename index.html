<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>To-Do List App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <h1>To-Do List App</h1>

    <section class="add-task-section">

      <h2>Add a Task</h2>

      <label for="task-input">Task:</label>

      <input
        type="text"
        id="task-input"
        placeholder="Enter a task"
      >

      <label for="importance-select">Importance:</label>

      <select id="importance-select">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>

      <button id="add-task-btn">Add Task</button>

      <p id="error-message"></p>

    </section>


    <section class="task-section">

      <h2>Tasks</h2>

      <ul id="task-list">

        <!-- JavaScript will add tasks here -->

      </ul>

    </section>


    <section class="timer-section">

      <h2>Doing Now</h2>

      <p id="doing-now-task">No task selected</p>

      <label for="duration-select">Focus Time:</label>

      <select id="duration-select">
        <option value="10">10 minutes</option>
        <option value="20">20 minutes</option>
        <option value="30">30 minutes</option>
        <option value="40">40 minutes</option>
        <option value="50">50 minutes</option>
        <option value="60">60 minutes</option>
        <option value="70">70 minutes</option>
        <option value="80">80 minutes</option>
        <option value="90">90 minutes</option>
        <option value="100">100 minutes</option>
        <option value="110">110 minutes</option>
        <option value="120">120 minutes</option>
      </select>

      <p id="timer-display">10:00</p>

      <button id="start-btn" disabled>Start</button>

      <button id="reset-btn">Reset</button>

      <button id="clear-doing-now-btn">Clear Selection</button>

    </section>


    <section
      id="completion-prompt"
      class="completion-prompt"
      hidden
    >

      <h2>Did you finish this task?</h2>

      <button id="yes-btn">Yes</button>

      <button id="no-btn">No</button>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
